# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(LEGAL_OPERATOR_NAME): 'À compléter — raison sociale de l’exploitant'
    env(LEGAL_OPERATOR_ADDRESS): 'À compléter — adresse postale de l’exploitant'
    env(LEGAL_OPERATOR_EMAIL): 'À compléter — adresse courriel de l’exploitant'
    env(PRIVACY_OFFICER_NAME): 'À compléter — nom ou fonction du responsable'
    env(PRIVACY_OFFICER_EMAIL): 'À compléter — adresse courriel du responsable'
    env(LEGAL_EFFECTIVE_DATE): 'À compléter — date d’entrée en vigueur'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\PublicSite\Presentation\Http\LegalController:
        arguments:
            $operatorName: '%env(LEGAL_OPERATOR_NAME)%'
            $operatorAddress: '%env(LEGAL_OPERATOR_ADDRESS)%'
            $operatorEmail: '%env(LEGAL_OPERATOR_EMAIL)%'
            $privacyOfficerName: '%env(PRIVACY_OFFICER_NAME)%'
            $privacyOfficerEmail: '%env(PRIVACY_OFFICER_EMAIL)%'
            $effectiveDate: '%env(LEGAL_EFFECTIVE_DATE)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    Resend\Client:
        factory: [ 'Resend', 'client' ]
        arguments: [ '%env(RESEND_API_KEY)%' ]

    App\Shared\Infrastructure\Mailer\ResendMailer:
        arguments:
            $from: '%env(RESEND_FROM)%'
            $logger: '@logger'

    App\Compliance\Application\ExportService:
        arguments:
            $exportDirectory: '%kernel.project_dir%/var/uploads/ccq'

    App\Safety\Infrastructure\PhotoUploader:
        arguments:
            $storageDirectory: '%kernel.project_dir%/public'

    App\Compliance\Infrastructure\RbqEvidenceUploader:
        arguments:
            $storageDirectory: '%kernel.project_dir%/var/uploads'

    Symfony\Component\RateLimiter\RateLimiterFactory $loginPerEmailLimiterFactory: '@limiter.login_per_email'
    Symfony\Component\RateLimiter\RateLimiterFactory $loginPerIpLimiterFactory: '@limiter.login_per_ip'

    App\Subscription\Application\StripeService:
        arguments:
            $starterPriceId: '%env(STRIPE_STARTER_PRICE_ID)%'
            $proPriceId: '%env(STRIPE_PRO_PRICE_ID)%'
            $businessPriceId: '%env(STRIPE_BUSINESS_PRICE_ID)%'

    App\Compliance\Application\MessageHandler\BatchRbqCheckMessageHandler:
        arguments:
            $cache: '@rbq.progress'

    App\Compliance\Presentation\Component\RbqBatchProgress:
        arguments:
            $cache: '@rbq.progress'
