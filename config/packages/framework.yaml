# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # French is the default UI locale (EN fallbacks in translations/messages.en.yaml)
    default_locale: fr_FR

    # Trust only the immediate Caddy/Laravel Cloud proxy, never arbitrary
    # forwarded headers sent by a client. REMOTE_ADDR is resolved per request.
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_headers: [x-forwarded-for, x-forwarded-host, x-forwarded-proto, x-forwarded-port, x-forwarded-prefix]

    # Session: 30-day lifetime, secure + httponly + samesite=lax cookie.
    # See specs/04-auth.md.
    session:
        cookie_lifetime: 2592000
        cookie_secure: true
        cookie_httponly: true
        cookie_samesite: lax

    # French is the default UI locale (EN fallbacks in translations/messages.en.yaml)

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
