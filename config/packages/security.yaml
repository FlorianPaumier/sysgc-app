security:
    # Passwordless: users never have a password, so the hasher is a no-op.
    password_hashers:
        App\Identity\Domain\Model\User:
            algorithm: 'null'

    providers:
        app_user_provider:
            entity:
                class: App\Identity\Domain\Model\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Identity\Infrastructure\Security\MagicLinkAuthenticator
            logout:
                path: auth_logout
                target: auth_login

    access_control:
        - { path: ^/(connexion|inscription|login/check-email|invitation/accepter), roles: PUBLIC_ACCESS }
        - { path: ^/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/a-propos$, roles: PUBLIC_ACCESS }
        - { path: ^/contact$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Identity\Domain\Model\User:
                algorithm: 'null'
