framework:
    rate_limiter:
        login_per_email:
            policy: fixed_window
            limit: 3
            interval: '15 minutes'
            # Keyed by user email to enforce per‑email limits.
            # The controller extracts the email from the form and passes it.
        login_per_ip:
            policy: token_bucket
            limit: 20
            rate: { interval: '5 minutes', amount: 5 }
            # Keyed by IP address (default) – no custom key extractor needed.
