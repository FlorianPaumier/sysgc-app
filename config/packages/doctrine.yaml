doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Exclude Messenger's table from schema diffs/migrations — it is created
        # by `messenger:setup-transports`, not from entity mappings.
        schema_filter: ~^(?!messenger_messages)~

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Model'
                prefix: 'App\Identity\Domain\Model'
            Project:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Project/Domain/Model'
                prefix: 'App\Project\Domain\Model'
            Workforce:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Workforce/Domain/Model'
                prefix: 'App\Workforce\Domain\Model'
            Compliance:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Compliance/Domain/Model'
                prefix: 'App\Compliance\Domain\Model'
            Commercial:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Commercial/Domain/Model'
                prefix: 'App\Commercial\Domain\Model'
            Safety:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Safety/Domain/Model'
                prefix: 'App\Safety\Domain\Model'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
