framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # doctrine://default → uses PostgreSQL default connection
                retry_strategy:
                    max_retries: 3
                    delay: 1000        # 1s
                    multiplier: 2
                    max_delay: 5000    # 5s
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            App\Identity\Application\MagicLink\SendMagicLinkMessage: async
            App\Compliance\Application\ExportCCQMessage: async
            App\Compliance\Message\BatchRbqCheckMessage: async
            App\Compliance\Message\CheckSingleLicenseMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
